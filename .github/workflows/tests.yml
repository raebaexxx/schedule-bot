name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax-check webapp JS
        run: |
          node --check webapp/js/app.js
          node --check webapp/js/liquid.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
